<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AGORA Yönetim</title>
  <meta name="theme-color" content="#255e71">
  <meta name="description" content="Kat maliki hesap özeti, ekstre ve duyurular">
  <!-- WhatsApp / e-posta önizleme kutusu -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AGORA Yönetim">
  <meta property="og:title" content="AGORA Yönetim – Kat Maliki Hesap Özeti">
  <meta property="og:description" content="Hesap özetinizi, ekstrenizi ve duyuruları görmek için dokunun.">
  <meta property="og:image" content="https://ozturkmuhasebe.github.io/agora/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AGORA">
  <style>
    :root { --koyu: #255e71; --krem: #f6efe0; --yazi: #1d2b30; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--krem); color: var(--yazi);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh;
      padding-top: env(safe-area-inset-top); }
    #panel[hidden] { display: none; }
    #panel { flex: 1; width: 100%; border: 0; display: block; background: #fff; }

    /* Açılış ekranı */
    #acilis { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: var(--krem);
      z-index: 5; transition: opacity .4s; }
    #acilis img { width: 140px; height: 140px; }
    #acilis .ad { font-size: 30px; font-weight: 700; color: var(--koyu); letter-spacing: 2px; }
    #acilis .alt { font-size: 18px; color: var(--koyu); }
    .nokta { width: 12px; height: 12px; border-radius: 50%; background: var(--koyu);
      display: inline-block; margin: 0 4px; animation: zipla 1.2s infinite ease-in-out; }
    .nokta:nth-child(2) { animation-delay: .2s; } .nokta:nth-child(3) { animation-delay: .4s; }
    @keyframes zipla { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
    #acilis.gizli { opacity: 0; pointer-events: none; }

    /* Linksiz açılırsa */
    #linkYok { display: none; padding: 32px 22px; text-align: center; font-size: 20px;
      line-height: 1.5; max-width: 520px; margin: auto; }
    #linkYok img { width: 110px; height: 110px; }

    /* "Ana ekrana ekle" şeridi */
    #ekleSerit { display: none; background: var(--koyu); color: #fff; padding: 14px 16px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 18px; line-height: 1.45; }
    #ekleSerit .satir { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    #ekleSerit button { font-size: 18px; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
    #ekleBtn { background: #fff; color: var(--koyu); font-weight: 700; }
    #sonraBtn { background: transparent; color: #fff; text-decoration: underline; }
    /* "Bildirim gelsin mi?" şeridi (yalnızca ana ekrana eklenmiş uygulamada) */
    #bildirimSerit { display: none; background: #fff4cc; color: #3d3200; padding: 14px 16px; border-top: 2px solid #e6cf7a;
      padding-bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 18px; line-height: 1.45; }
    #bildirimSerit .satir { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    #bildirimSerit button { font-size: 18px; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
    #bildirimEvet { background: var(--koyu); color: #fff; font-weight: 700; }
    #bildirimHayir { background: transparent; color: #3d3200; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="acilis">
    <img src="logo.png" alt="">
    <div class="ad">AGORA</div>
    <div class="alt">Yönetim paneli açılıyor…</div>
    <div><span class="nokta"></span><span class="nokta"></span><span class="nokta"></span></div>
  </div>

  <div id="linkYok">
    <img src="logo.png" alt=""><br>
    Lütfen size <b>WhatsApp</b> veya <b>e-posta</b> ile gönderilen kişisel bağlantıya dokunarak açın.
  </div>

  <iframe id="panel" title="AGORA Yönetim Paneli" allow="web-share; clipboard-write" hidden></iframe>

  <div id="bildirimSerit" role="region" aria-label="Bildirim izni">
    <div class="satir">
      <span>🔔 Hesap özetiniz güncellenince telefonunuza <b>bildirim</b> gelsin mi?</span>
      <span>
        <button id="bildirimEvet" type="button">Evet</button>
        <button id="bildirimHayir" type="button">Hayır</button>
      </span>
    </div>
  </div>

  <div id="ekleSerit" role="region" aria-label="Ana ekrana ekle">
    <div class="satir">
      <span id="ekleMetin">📲 Bu paneli telefonunuza <b>uygulama</b> olarak ekleyin.</span>
      <span>
        <button id="ekleBtn" type="button">Ekle</button>
        <button id="sonraBtn" type="button">Daha sonra</button>
      </span>
    </div>
  </div>

<script>
(function () {
  // ---- 1) Hangi site, hangi kişi? (link: ?s=<site>&tok=<anahtar>) ----
  var DEPO = "agora_giris";
  var p = new URLSearchParams(location.search);
  var s = p.get("s") || "", tok = p.get("tok") || "";
  var GECERLI = /^[A-Za-z0-9_-]{10,200}$/;

  function oku() { try { return JSON.parse(localStorage.getItem(DEPO) || "null"); } catch (e) { return null; } }
  function yaz(v) { try { localStorage.setItem(DEPO, JSON.stringify(v)); } catch (e) {} }

  if (GECERLI.test(s) && GECERLI.test(tok)) {
    yaz({ s: s, tok: tok });               // ana ekrandan açılınca da hatırlansın
  } else {
    var k = oku();
    if (k && GECERLI.test(k.s) && GECERLI.test(k.tok)) { s = k.s; tok = k.tok; }
    else { s = tok = ""; }
  }

  var acilis = document.getElementById("acilis");
  function acilisiKapat() { acilis.classList.add("gizli"); }

  if (!s) {
    acilisiKapat();
    document.getElementById("linkYok").style.display = "block";
  } else {
    // ---- 2) Paneli tam ekran aç ----
    var panel = document.getElementById("panel");
    panel.onload = function () { setTimeout(acilisiKapat, 300); };
    setTimeout(acilisiKapat, 12000); // ne olursa olsun açılış ekranı sonsuza kadar kalmasın
    panel.src = "https://script.google.com/macros/s/" + encodeURIComponent(s) +
                "/exec?tok=" + encodeURIComponent(tok);
    panel.hidden = false;
  }

  // ---- 3) "Ana ekrana ekle" yardımı ----
  var serit = document.getElementById("ekleSerit");
  var ekleBtn = document.getElementById("ekleBtn");
  var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  var ertelendi = false;
  try { ertelendi = Number(localStorage.getItem("agora_ekle_sonra") || 0) > Date.now(); } catch (e) {}

  document.getElementById("sonraBtn").onclick = function () {
    serit.style.display = "none";
    try { localStorage.setItem("agora_ekle_sonra", String(Date.now() + 7 * 864e5)); } catch (e) {} // 1 hafta sorma
  };

  if (s && !standalone && !ertelendi) {
    var ua = navigator.userAgent || "";
    var iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (iOS) {
      document.getElementById("ekleMetin").innerHTML =
        "📲 Uygulama olarak eklemek için: alttaki <b>Paylaş</b> düğmesine (kare ve yukarı ok ⬆️) dokunun, " +
        "sonra <b>“Ana Ekrana Ekle”</b>yi seçin.";
      ekleBtn.style.display = "none";
      serit.style.display = "block";
    } else {
      var istem = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault(); istem = e; serit.style.display = "block";
      });
      ekleBtn.onclick = function () {
        if (!istem) return;
        istem.prompt();
        istem.userChoice.finally(function () { istem = null; serit.style.display = "none"; });
      };
      window.addEventListener("appinstalled", function () { serit.style.display = "none"; });
    }
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  // ---- 4) BİLDİRİMLER (Firebase Cloud Messaging) ----
  // Yalnızca ana ekrana eklenmiş uygulamada sorulur (iPhone'da bildirim ancak böyle çalışır).
  // İzin verilirse telefonun bildirim adresi, kişisel link anahtarıyla birlikte
  // sitenin Google uygulamasına (doPost) kaydedilir. Kişisel veri gönderilmez.
  var FIREBASE_AYAR = {
    apiKey: "AIzaSyAE9zOwhp8ntNGCJbqj3y6IbzPSwLjKvgE",
    authDomain: "agoravista-81491.firebaseapp.com",
    projectId: "agoravista-81491",
    storageBucket: "agoravista-81491.firebasestorage.app",
    messagingSenderId: "826606859163",
    appId: "1:826606859163:web:7bc0b481b1ce89386d673e"
  };
  var VAPID_ANAHTAR = "BNYxDd46aFF61JlOjTlmQ9Bw0yEo_EmCpxWlEffQgh3c_h_qLOgrYvCTN-lMMVEhkaj6CB5PWmk89w1ld_egQqo";
  var bSerit = document.getElementById("bildirimSerit");

  function bildirimDestekli() {
    return !!(s && window.firebase && "Notification" in window && "serviceWorker" in navigator && "PushManager" in window);
  }

  function cihaziKaydet() {
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_AYAR);
      navigator.serviceWorker.ready.then(function (kayit) {
        return firebase.messaging().getToken({ vapidKey: VAPID_ANAHTAR, serviceWorkerRegistration: kayit });
      }).then(function (adres) {
        if (!adres) return;
        // Aynı adres için günde en fazla bir kez kayıt gönder
        var anahtar = "agora_bildirim_" + s;
        var onceki = null;
        try { onceki = JSON.parse(localStorage.getItem(anahtar) || "null"); } catch (e) {}
        if (onceki && onceki.adres === adres && onceki.tok === tok && Date.now() - onceki.zaman < 864e5) return;
        return fetch("https://script.google.com/macros/s/" + encodeURIComponent(s) + "/exec", {
          method: "POST", mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ islem: "bildirimKaydi", tok: tok, fcm: adres })
        }).then(function () {
          try { localStorage.setItem(anahtar, JSON.stringify({ adres: adres, tok: tok, zaman: Date.now() })); } catch (e) {}
        });
      }).catch(function () {});
    } catch (e) {}
  }

  window.addEventListener("load", function () {
    if (!bildirimDestekli()) return;
    if (Notification.permission === "granted") { cihaziKaydet(); return; } // adres tazelensin
    if (Notification.permission !== "default" || !standalone) return;
    var ertele = 0;
    try { ertele = Number(localStorage.getItem("agora_bildirim_sonra") || 0); } catch (e) {}
    if (ertele > Date.now()) return;
    setTimeout(function () { bSerit.style.display = "block"; }, 4000); // panel açıldıktan sonra sor
  });

  document.getElementById("bildirimEvet").onclick = function () {
    bSerit.style.display = "none";
    Notification.requestPermission().then(function (izin) {
      if (izin === "granted") cihaziKaydet();
    });
  };
  document.getElementById("bildirimHayir").onclick = function () {
    bSerit.style.display = "none";
    try { localStorage.setItem("agora_bildirim_sonra", String(Date.now() + 30 * 864e5)); } catch (e) {} // 30 gün sorma
  };
})();
</script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</body>
</html>
